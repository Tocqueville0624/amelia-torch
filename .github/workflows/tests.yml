name: Python and R CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU / ${{ matrix.os }} / Python 3.12 / R 4.5.3
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - name: Install CPU PyTorch on Windows and Linux
        if: runner.os != 'macOS'
        run: python -m pip install 'torch>=2.10,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python package and test tools
        run: python -m pip install -e '.[dev,torch,reference]'
      - name: Select the installed Python for the R bridge
        run: python -c "import os,sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('RETICULATE_PYTHON=' + sys.executable + '\n')"
      - name: Install R dependencies and local R package
        shell: Rscript {0}
        run: |
          install.packages(c("reticulate", "Amelia", "jsonlite"))
          stopifnot(as.character(packageVersion("Amelia")) == "1.8.3")
          install.packages("r-package", repos = NULL, type = "source")
          stopifnot(requireNamespace("ameliatorch", quietly = TRUE))
      - name: Python tests
        run: python -m pytest -q
      - name: Python lint
        run: python -m ruff check src tests scripts
      - name: R environment and imputation interface contract
        run: Rscript r-package/tests/bridge.R
      - name: Official R compatibility
        run: Rscript r-package/tests/compatibility.R
      - name: R hybrid compatibility
        run: Rscript r-package/tests/torch-compat.R
      - name: Backend history metadata
        run: Rscript r-package/tests/reference_metadata.R
      - name: Downstream workflows and random-stream regression
        run: Rscript r-package/tests/downstream.R

  # Hosted CPU runners do not validate MPS or CUDA performance. Accelerator
  # correctness and synchronized benchmarks are run explicitly on local devices.
